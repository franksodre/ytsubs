<!DOCTYPE>
<head>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ytsubs</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/htmx.org@2.0.7"></script>

    <!-- <script -->
    <!-- src="https://cdn.jsdelivr.net/npm/hyperscript.org@0.9.93/dist/_hyperscript.min.js" -->
    <!-- integrity="sha384-/6HsqTiz02YfFBUhzTwlH/yxe68DhfnkdHiWytM3nxAzs/yvG+3FZY0f4KLnNoov" -->
    <!-- crossorigin="anonymous"></script> -->
  </head>
</head>
<html>
  <body>
    @include './partials/header.html'
    <section class="flex align-center justify-center w-full my-8">
      <form class="flex items-end space-x-4"
          hx-post="/"
          hx-target="#result"
          hx-on::before-request="snipper.hidden = false"
          hx-on::after-request="snipper.hidden = true"
          hx-swap="innerHTML"
        >
        <div class="">
          <div class="flex flex-col space-y-2">
            <div>
              @include './partials/formats.html'
            </div>
            <input
              name="url" 
              type="url"
              id="url"
              required
              placeholder="Enter a youtube link to download subs"
              class="p-2 ring-2 ring-slate-700 w-96"
            />
            </div>
        </div>
          <button 
            class="uppercase text-sm bg-slate-700 text-zinc-100 p-2 px-4
            rounded w-fit h-fit text-center"
            type="submit"
            >
            subling
          </button>
      </form>
    </section>
    <div id="snipper" hidden>Loading...</div>
      <section class="flex space-y-4 capitalize">
      <div id="result" class="border-l-lg border-slate-600 px-4">
      </div>
    </section>
  </body>
</html>
