<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ytsubs</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="icon" href="../favicon.ico" type="image/x-icon">

  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="https://unpkg.com/htmx.org@2.0.7"></script>
</head>

<body class="min-h-screen bg-zinc-50 text-zinc-950">

  @include './partials/header.html'

  <main class="mx-auto max-w-5xl px-6">

    <!-- Hero -->
    <section class="flex flex-col items-center pt-24 pb-16 text-center">

      <div class="mb-4 px-3 py-1
                  text-xs uppercase text-zinc-500">
        YouTube subtitles
      </div>

      <h1 class="text-5xl font-semibold tracking-tight sm:text-6xl">
        Download subtitles.
      </h1>

      <p class="mt-5 max-w-xl text-base leading-7 text-zinc-500">
        Download subtitles from all major video platforms.
      </p>

      <!-- Form -->
      <form
        class="mt-10 w-full max-w-2xl"
        hx-post="/"
        hx-target="#result"
        hx-on::before-request="spinner.hidden = false"
        hx-on::after-request="spinner.hidden = true"
        hx-swap="innerHTML"
      >

        <div class="flex overflow-hidden rounded-xl border border-zinc-300
                    bg-white shadow-sm transition
                    focus-within:border-zinc-500 focus-within:ring-4
                    focus-within:ring-zinc-100">

          <input
            name="url"
            type="url"
            id="url"
            required
            autocomplete="off"
            placeholder="https://youtube.com/watch?v=..."
            class="min-w-0 flex-1 bg-transparent px-4 py-4 text-sm
                   outline-none placeholder:text-zinc-400"
            value="https://www.youtube.com/watch?v=-sYU7xlheNE"
          />

          <button
            type="submit"
            class="m-1 rounded-lg bg-zinc-950 px-5 py-3 text-sm font-medium
                   text-white transition hover:bg-zinc-800
                   active:scale-[0.98]"
          >
            Download
          </button>
        </div>

        <div class="mt-3 flex items-center justify-between">

          @include './partials/formats.html'

          <span
            id="spinner"
            hidden
            class="text-xs text-zinc-400"
          >
            Fetching subtitles...
          </span>

        </div>

      </form>
    </section>

    <!-- Result -->
    <section class="pb-24">
      <div id="result"></div>
    </section>

  </main>

</body>
</html>
